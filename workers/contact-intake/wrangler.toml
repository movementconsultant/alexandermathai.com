# Cloudflare Worker deployment config — NOT deployed by this session (no
# Cloudflare account/dashboard access exists in this environment). Review,
# fill in the placeholders below, and deploy yourself — see README.md.

name = "avm-contact-intake"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Non-secret configuration. Edit these directly.
[vars]
ALLOWED_ORIGIN = "https://alexandermathai.com"
NOTIFY_EMAIL = "movementconsultant@gmail.com"
# Must be an address on a domain you've verified in Resend (or your chosen
# provider) — see README "Verify a sending domain". A placeholder like
# "onboarding@resend.dev" only works for Resend's own test mode, never for
# real delivery to an arbitrary inbox.
FROM_EMAIL = "intake@alexandermathai.com"

# Secrets — never put these here. Set with:
#   wrangler secret put RESEND_API_KEY
# (RESEND_API_KEY is read via `env.RESEND_API_KEY` in src/worker.ts.)

# Optional: real, distributed rate limiting requires a KV namespace. Create
# one (`wrangler kv namespace create RATE_LIMIT_KV`) and uncomment below with
# the id it prints. Without this binding, the Worker still runs but skips
# rate limiting entirely (fails open) — see README "Rate limiting".
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"

# Route this Worker to a path once ready, e.g.:
# [[routes]]
# pattern = "alexandermathai.com/api/contact"
# zone_name = "alexandermathai.com"
